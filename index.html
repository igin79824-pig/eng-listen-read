<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的網頁專區 | 專案目錄</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
    }

    /* 卡片格線佈局：桌機三欄、平板兩欄、手機單欄 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-color);
    }

    .card-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary-color);
      background-color: #eff6ff;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 12px;
      align-self: flex-start;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      flex-grow: 1;
      margin-bottom: 16px;
    }

    .card-action {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
      display: flex;
      align-items: center;
    }

    .card-action::after {
      content: ' →';
      transition: transform 0.2s ease;
    }

    .card:hover .card-action::after {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>學習活動與專案專區</h1>
      <p>點選下方卡片即可進入各個獨立主題網頁</p>
    </header>

    <!-- 卡片列表區塊 -->
    <main class="grid">

      <!-- 第 1 份網頁 -->
      <a href="page-01/" class="card">
        <div>
          <span class="card-tag">單元 01</span>
          <h2 class="card-title">台南在地飲食文化</h2>
          <p class="card-desc">探索在地食材與傳統小吃的故事，互動圖文專題。</p>
        </div>
        <div class="card-action">前往瀏覽</div>
      </a>

      <!-- 第 2 份網頁 -->
      <a href="page-02/" class="card">
        <div>
          <span class="card-tag">單元 02</span>
          <h2 class="card-title">海洋永續與減塑探究</h2>
          <p class="card-desc">觀察塑膠微粒對海洋環境的影響，線上學習任務單。</p>
        </div>
        <div class="card-action">前往瀏覽</div>
      </a>

      <!-- 第 3 份網頁 -->
      <a href="page-03/" class="card">
        <div>
          <span class="card-tag">單元 03</span>
          <h2 class="card-title">綠色包裝設計展示</h2>
          <p class="card-desc">結合環保理念與創意思維的學生專案成果呈現。</p>
        </div>
        <div class="card-action">前往瀏覽</div>
      </a>

      <!-- 未來有新網頁時，複製上方一整組 <a ...> 貼在下方即可 -->

    </main>
  </div>

</body>
</html>
